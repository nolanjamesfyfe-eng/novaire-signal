<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0a0c"><title>Novaire Signal · Private Portfolio</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0a0a0c;color:#f0eef8;font-family:Inter,system-ui,sans-serif}body{min-height:100vh;display:grid;place-items:center;padding:24px}.lock{width:min(390px,100%);border:1px solid #24232d;background:#111116;border-radius:8px;padding:28px;box-shadow:0 24px 80px #000}.brand{color:#b59662;font:500 11px Inter,sans-serif;letter-spacing:.18em;text-transform:uppercase;margin-bottom:30px;display:flex;align-items:center;gap:7px}.lock-bolt{display:inline-flex;color:#b59662}.lock-bolt svg{width:9px;height:14px;fill:currentColor}.eyebrow{font-size:10px;color:#b59662;text-transform:uppercase;letter-spacing:.12em}h1{font:500 31px 'Cormorant Garamond',serif;margin:11px 0 8px}p{font-size:13px;line-height:1.6;color:#8b879d;margin:0 0 24px}.pin{display:grid;grid-template-columns:1fr auto;gap:8px}.pin input{width:100%;background:#0a0a0c;border:1px solid #2b2935;border-radius:5px;color:#f0eef8;font:500 22px Inter,sans-serif;letter-spacing:.4em;text-align:center;padding:12px;outline:0}.pin input:focus{border-color:#b59662}.pin button{border:0;border-radius:5px;background:#b59662;color:#0a0a0c;font-weight:600;padding:0 17px;cursor:pointer}.remember{display:flex;align-items:center;gap:9px;margin-top:15px;color:#aaa6b8;font-size:12px}.remember input{accent-color:#b59662}.status{min-height:18px;margin-top:17px;color:#e28b92;font-size:11px}.back{display:inline-block;margin-top:20px;color:#706c82;font-size:11px;text-decoration:none}</style></head><body><main class="lock"><div class="brand"><span class="lock-bolt" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M13.2 1.5 4.4 13.1h6.1l-1 9.4 10.1-13H13z"/></svg></span>Novaire Signal</div><div class="eyebrow">Private portfolio</div><h1>Capital stays behind the curtain.</h1><p>Use the same four-digit PIN as Novairecito.</p><form id="form"><div class="pin"><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="current-password" aria-label="Four-digit PIN" autofocus><button id="submit">Enter</button></div><div class="status" id="status"></div></form><a class="back" href="/">← Back to Novaire Signal</a></main><script>const form=document.getElementById('form'),pin=document.getElementById('pin'),status=document.getElementById('status'),submit=document.getElementById('submit');form.onsubmit=async e=>{e.preventDefault();if(!/^\d{4}$/.test(pin.value)){status.textContent='Enter your four-digit PIN.';return}submit.disabled=true;status.textContent='Unlocking…';try{const r=await fetch('/api/portfolio-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:pin.value})}),d=await r.json();if(!r.ok)throw new Error(d.error||'Access denied');location.replace('/portfolio')}catch(err){status.textContent=err.message;pin.select();submit.disabled=false}};</script></body></html>

6 219 44Z"/></svg></a></div></div><div class="brand"><span class="lock-bolt" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M13.2 1.5 4.4 13.1h6.1l-1 9.4 10.1-13H13z"/></svg></span>Novaire Signal</div><div class="eyebrow">Private portfolio</div><h1>Capital stays behind the curtain.</h1><p>Use the same five-digit PIN as Novairecito.</p><form id="form"><div class="pin"><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" autocomplete="current-password" aria-label="Five-digit PIN" autofocus><button id="submit">Enter</button></div><div class="status" id="status"></div></form><a class="back" href="/">← Back to Novaire Signal</a><div class="signal-gate-footer" style="display:flex;justify-content:center"><div class="signal-brand-row" aria-label="Novaire Signal navigation"><a href="/flaneur" class="signal-map" title="Flâneur happenings" aria-label="Flâneur happenings"><svg class="signal-map-icon" viewBox=".85 .85 22.3 22.3" aria-hidden="true" focusable="false"><circle class="signal-map-ocean" cx="12" cy="12" r="10.25"/><g class="signal-map-land"><path d="M3.08 8.67 4.2 6.43l1.7-1.67 2.29-1.34 2.03-.68 1.02.42-.43.88-1.61.44-.56.9-1.02.18-.42 1.18-1.12.16-.35 1.2.7 1.14 1.47.49.63.9-.16 1.14-1.02.66-.34 1.14-1.1-.04-.55-1.02-1.28-.5-.7-1.45-1.05-.81-.49-1.07Z"/><path d="m9.12 13.04 1.05-.52 1.39.33.91 1.06-.17 1.36-.78 1.15-.22 1.6-.83 1.13-.31 1.7-.67.69-.73-1.43-.54-1.78-.1-1.47-.67-1.18.58-1.08.2-.86Z"/><path d="m12.45 2.06 1.29-.23 1.06.38-.24.73-1.23.41-.88-.38Z"/><path d="m13.42 5.04 1.08-.83 2.25-.47 2.03.75 1.39 1.23.65 1.17-.63.74-1.46-.27-.83.48-1.18-.53-.93.5-1.05-.31-.86-.98-.98-.17-.43-.65Z"/><path d="m14.26 8.23 1.18-.39 1.24.44.82 1.08-.13 1.56-.72 1.14-.36 1.88-.98 1.77-.9.65-.7-1.03-.23-1.66-.78-1.22.25-1.54-.37-1.2.41-1.04Z"/><path d="m17.57 16.51 1.24-.55 1.28.28.76.82-.24 1.12-1.12.64-1.3-.17-.75-.83Z"/></g><circle class="signal-map-rim" cx="12" cy="12" r="10.25"/></svg></a><a href="/" class="signal-wordmark" aria-label="Novaire Signal home">Novaire <span>Signal</span></a><a href="/portfolio/" class="signal-bolt" title="Portfolio" aria-label="Portfolio"><svg class="signal-bolt-icon" viewBox="45 38 200 264" aria-hidden="true" focusable="false"><path fill="currentColor" d="M219 44Q217 43 215 44L51 180Q49 183 51 185Q53 187 56 187L130 186Q132 186 132 188L72 289Q70 293 73 295Q76 297 83 291L239 155Q241 153 239 149Q238 147 236 147L166 148Q162 148 160 146L219 51Q222 46 219 44Z"/></svg></a></div></div></main><script>const form=document.getElementById('form'),pin=document.getElementById('pin'),status=document.getElementById('status'),submit=document.getElementById('submit');form.onsubmit=async e=>{e.preventDefault();if(!/^\d{5}$/.test(pin.value)){status.textContent='Enter your five-digit PIN.';return}submit.disabled=true;status.textContent='Unlocking…';try{const r=await fetch('/api/portfolio-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:pin.value})}),d=await r.json();if(!r.ok)throw new Error(d.error||'Access denied');location.replace('/portfolio')}catch(err){status.textContent=err.message;pin.select();submit.disabled=false}};</script></body></html>

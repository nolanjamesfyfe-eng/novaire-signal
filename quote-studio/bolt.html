<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>Quote preview</title><style>@font-face{font-family:Editorial;src:url(fonts/cormorant-garamond-italic-400.woff2);font-style:italic}@font-face{font-family:Inter;src:url(fonts/inter-500-700.woff2);font-weight:100 900}*{box-sizing:border-box}body{margin:0;background:#050505;color:#eee;font:14px Inter,sans-serif;min-height:100vh;display:grid;place-content:center;padding:20px}.wrap{width:min(1200px,94vw);position:relative}canvas{display:block;width:100%;height:auto}.bolt{position:absolute;right:7%;top:10%;width:7%;height:14%;border:0;background:transparent;cursor:pointer;border-radius:12px}.bolt:hover,.bolt:focus-visible{outline:1px solid #b59662;box-shadow:0 0 20px #b5966219}dialog{color:#eee;background:#10100f;border:1px solid #655235;border-radius:16px;padding:26px;max-width:90vw}dialog::backdrop{background:#000a}button,a{font:inherit}dialog button{display:block;width:100%;padding:14px;margin:9px 0;background:#191713;border:1px solid #554630;border-radius:8px;color:#e9d5b1;cursor:pointer}.note{text-align:center;color:#8e8578;font-size:12px;margin:20px}a{color:#b59662}#status{max-width:320px;line-height:1.5}</style></head><body><main><div class="wrap"><canvas id="art" width="1600" height="900"></canvas><button class="bolt" id="bolt" aria-label="Share this quote" title="Share this quote"></button></div><p class="note">Tap the gold bolt to share · <a href="?design=atelier">Atelier</a> / <a href="?design=margin">Margin</a></p></main><dialog id="menu"><h2>Share this quote</h2><button id="native">Share image…</button><button id="x">Download for X</button><button id="story">Download for Stories</button><button id="copy">Copy quote</button><button id="close">Close</button><p id="status" role="status"></p></dialog><script>
const design=new URLSearchParams(location.search).get('design')==='margin'?'margin':'atelier',canvas=document.getElementById('art'),ctx=canvas.getContext('2d'),gold='#b59662',text='The impediment to action advances action.\nWhat stands in the way becomes the way.',author='Marcus Aurelius',menu=document.getElementById('menu');
const boltPath=new Path2D('M219 44Q217 43 215 44L51 180Q49 183 51 185Q53 187 56 187L130 186Q132 186 132 188L72 289Q70 293 73 295Q76 297 83 291L239 155Q241 153 239 149Q238 147 236 147L166 148Q162 148 160 146L219 51Q222 46 219 44Z');
function line(x,y,x2,y2,color=gold){ctx.strokeStyle=color;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke()}
function draw(story=false){canvas.width=story?1080:1600;canvas.height=story?1920:900;const w=canvas.width,h=canvas.height;ctx.fillStyle='#080808';ctx.fillRect(0,0,w,h);const g=ctx.createRadialGradient(w*.5,h*.5,10,w*.5,h*.5,w*.8);g.addColorStop(0,'#17140f');g.addColorStop(1,'#070707');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.save();ctx.translate(w*.895,h*.12);ctx.scale(w/1600*.23,h/900*.23);ctx.translate(-40,-35);ctx.fillStyle=gold;ctx.fill(boltPath);ctx.restore();ctx.textBaseline='top';
if(design==='atelier'){ctx.strokeStyle='#b5966240';ctx.strokeRect(52,52,w-104,h-104);line(w/2-28,h*.235,w/2+28,h*.235);ctx.font=`italic ${story?70:76}px Editorial`;ctx.textAlign='center';ctx.fillStyle='#f0eee8';const lines=story?['The impediment to action','advances action.','What stands in the way','becomes the way.']:['The impediment to action advances action.','What stands in the way becomes the way.'];lines.forEach((t,i)=>{ctx.fillStyle=i===lines.length-1?gold:'#f0eee8';ctx.fillText(t,w/2,h*(story?.35:.37)+i*(story?100:106))});line(w/2,h*.705,w/2,h*.755,'#b5966277');ctx.font='500 19px Inter';ctx.letterSpacing='5px';ctx.fillStyle=gold;ctx.fillText(author.toUpperCase(),w/2,h*.80);ctx.letterSpacing='0px';}
else{const left=story?125:190;line(left-42,h*.32,left-42,h*.70,gold);ctx.textAlign='left';ctx.font='500 23px Inter';ctx.fillStyle='#e6e2d9';ctx.fillText(author,left,h*.15);ctx.font='400 12px Inter';ctx.letterSpacing='4px';ctx.fillStyle='#817766';ctx.fillText('STOIC PHILOSOPHER',left,h*.15+40);ctx.letterSpacing='0px';ctx.font=`italic ${story?74:78}px Editorial`;const lines=story?['The impediment','to action advances action.','What stands in the way','becomes the way.']:['The impediment to action','advances action. What stands in the way','becomes the way.'];lines.forEach((t,i)=>{ctx.fillStyle=i===lines.length-1?gold:'#f0eee8';ctx.fillText(t,left,h*.34+i*(story?110:105))});line(left,h*.82,w-130,h*.82,'#b5966233');}}
function blob(){return new Promise(r=>canvas.toBlob(r,'image/png'))}let shareFile;
async function prepare(){draw(false);shareFile=new File([await blob()],'quote.png',{type:'image/png'})}
async function nativeShare(){try{if(navigator.canShare?.({files:[shareFile]})){await navigator.share({files:[shareFile]});menu.close()}else{menu.showModal();document.getElementById('status').textContent='File sharing is unavailable here. Download the image, then attach it in X or Instagram.'}}catch(e){if(e.name!=='AbortError'){if(!menu.open)menu.showModal();document.getElementById('status').textContent='Sharing failed. Download the image instead.'}}}
document.getElementById('bolt').onclick=()=>{if(navigator.canShare?.({files:[shareFile]}))nativeShare();else menu.showModal()};document.getElementById('native').onclick=nativeShare;document.getElementById('close').onclick=()=>menu.close();
async function download(story){draw(story);const b=await blob(),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=story?'quote-story.png':'quote-x.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);draw(false)}document.getElementById('x').onclick=()=>download(false);document.getElementById('story').onclick=()=>download(true);document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText('“'+text.replace('\n',' ')+'”\n— '+author);document.getElementById('status').textContent='Quote copied. No source link.'}catch{document.getElementById('status').textContent='Clipboard unavailable. Use image download.'}};
(async()=>{document.getElementById('bolt').disabled=true;await document.fonts.load('italic 76px Editorial');await document.fonts.load('500 23px Inter');await document.fonts.ready;await prepare();document.getElementById('bolt').disabled=false;window.ready=true})();
</script></body></html>
